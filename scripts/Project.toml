[deps]
ArgParse = "c7e460c6-2fb9-53a9-8c5b-16f535851c63"
Runic = "62bfec6d-59d7-401d-8490-b29ee721c001"

[compat]
# Runic is zero-config and deterministic, which is why it replaced JuliaFormatter: there is
# no style file to drift and no option anyone can disagree about. Its output can still change
# between releases, so the version is pinned and bumped deliberately -- run `make format` over
# the whole repo in the same commit that bumps it.
Runic = "1.10"
