name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  push:
    branches:
      - 'main'
    tags: 
      - v**
  check_run:
    types: [rerequested]
  schedule:
    - cron: '0 8 * * 1' # run the cron job one time per week on Monday 8:00 AM
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: write
  contents: read

jobs:
  paper:
    name: Paper Preview
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v6
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: paper/paper.pdf
  test:
    name: Tests ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    # Draft pull requests run no tests; marking one ready for review starts them.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.version, 'nightly') }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - '1.13'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          include-all-prereleases: true
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          USE_DEV: "false"
          LOG_USING_RXINFER: "false"
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1
          THROW_ON_INFERENCE_ERROR_HINT: "true"
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Archive test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-output-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: test/_output
  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout RxInfer
        uses: actions/checkout@v6
        with:
          path: RxInfer.jl
      - name: Checkout Examples
        uses: actions/checkout@v6
        with:
          repository: ReactiveBayes/RxInferExamples.jl
          path: RxInferExamples.jl
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Build and test examples
        env:
          LOG_USING_RXINFER: "false"
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1
        run: |
          julia -e 'using Pkg; Pkg.add("Weave"); Pkg.develop(path="RxInfer.jl"); Pkg.precompile()'
          cd RxInferExamples.jl
          make examples-dev RXINFER=../RxInfer.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: 
      - test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - run: make docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_USING_RXINFER: "false"
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1
          THROW_ON_INFERENCE_ERROR_HINT: "true"
