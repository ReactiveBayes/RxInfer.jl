name: Reactant check

# Compiling `infer` with Reactant (`ext/ReactantExt`, `make test-reactant`), on its own: Reactant
# changes often, so this check is kept apart from the test suite in `CI.yml`, and runs weekly too, to
# learn when a Reactant release breaks it.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reactant:
    name: Reactant check (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Julia and the latest: Reactant's overlays differ between them.
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - run: make test-reactant
        env:
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: '1'
